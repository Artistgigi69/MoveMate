name: Keep API awake

# Render's free plan sleeps after 15 idle minutes and the next visitor waits
# up to a minute. A ping every 10 minutes keeps it awake; one always-on
# service fits in the free plan's 750 hours a month. GitHub may delay
# scheduled runs, so an occasional cold start can still happen.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS -o /dev/null --retry 3 --retry-delay 10 --max-time 90 https://movemate-api-u6pv.onrender.com/
