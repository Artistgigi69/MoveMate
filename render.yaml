# Render Blueprint for the backend API. See DEPLOY.md.
#
# Free plan: the service sleeps after 15 minutes without traffic and the
# first request then takes up to a minute. Uploaded files (meter photos,
# leases) are stored in MongoDB, so the free plan's throwaway disk is fine.
# To go paid later, change plan to starter (no other changes needed).

services:
  - type: web
    name: movemate-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
